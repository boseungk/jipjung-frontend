<!DOCTYPE html>
<html lang="ko" data-theme="day">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전시회 컨셉 - Concept 3: Diorama Collection | SSAFYHome</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./assets/css/clay-design-system.css" />
  <link rel="stylesheet" href="./assets/css/concept-1-gallery.css" id="concept-1-css" disabled />
  <link rel="stylesheet" href="./assets/css/concept-2-showroom.css" id="concept-2-css" disabled />
  <link rel="stylesheet" href="./assets/css/concept-3-diorama.css" id="concept-3-css" />

  <!-- Tailwind for utility classes (from index.html) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP Animation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --cursor-size: 30px;
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --warm-glow-start: rgba(255, 180, 100, 0.0);
      --warm-glow-mid: rgba(255, 200, 120, 0.3);
      --warm-glow-end: rgba(255, 220, 150, 0.0);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #0f172a;
      /* Dark background for lighting */
      color: #f1f5f9;
      font-family: "Noto Sans KR", sans-serif;
    }

    /* --- Background Atmosphere --- */
    .winter-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #1e293b 0%, #020617 90%);
      z-index: -2;
    }

    /* Rising Warm Light Container */
    .rising-light-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .rising-light {
      position: absolute;
      bottom: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      height: 60vh;
      background: radial-gradient(ellipse at center,
          rgba(255, 160, 80, 0.25) 0%,
          rgba(255, 200, 120, 0.1) 40%,
          transparent 70%);
      filter: blur(40px);
      animation: rise-up 10s infinite linear;
      opacity: 0;
    }

    .rising-light:nth-child(1) {
      animation-delay: 0s;
      width: 100vw;
      height: 50vh;
      background: radial-gradient(ellipse at center, rgba(255, 180, 100, 0.3) 0%, transparent 60%);
    }

    .rising-light:nth-child(2) {
      animation-delay: 3.5s;
      width: 140vw;
      height: 70vh;
      background: radial-gradient(ellipse at center, rgba(255, 220, 150, 0.2) 0%, transparent 60%);
    }

    .rising-light:nth-child(3) {
      animation-delay: 7s;
      width: 80vw;
      height: 40vh;
      background: radial-gradient(ellipse at center, rgba(255, 140, 60, 0.25) 0%, transparent 60%);
    }

    @keyframes rise-up {
      0% {
        bottom: -30%;
        opacity: 0;
        transform: translateX(-50%) scale(0.8);
      }

      20% {
        opacity: 0.6;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        bottom: 100%;
        opacity: 0;
        transform: translateX(-50%) scale(1.2);
      }
    }

    .frost-overlay {
      position: fixed;
      inset: 0;
      background: url("https://grainy-gradients.vercel.app/noise.svg");
      opacity: 0.04;
      pointer-events: none;
      z-index: -1;
    }

    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Header - Minimalist */
    .header {
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header h1 {
      font-family: "Fredoka", sans-serif;
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      transition: color 0.5s ease;
      color: #fff;
      /* Force white for dark theme base */
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .header p {
      font-size: 1.125rem;
      line-height: 1.6;
      opacity: 0.75;
      letter-spacing: 0.01em;
      transition: color 0.5s ease;
      color: #cbd5e1;
    }

    /* Main Container */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
      position: relative;
      z-index: 10;
    }

    /* Concept Tabs - Neumorphic Style (Adapted for Dark) */
    .concept-tabs {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .concept-tab {
      padding: 0.875rem 1.75rem;
      border-radius: 24px;
      border: none;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: rgba(30, 41, 59, 0.6);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .concept-tab:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--warm-glow);
      /* Warm hover glow */
    }

    .concept-tab.active {
      background: linear-gradient(145deg, #e2b178 0%, #d4a063 100%);
      /* Warm Gold Gradient */
      color: white;
      box-shadow: 0 0 20px rgba(226, 177, 120, 0.4);
      border: none;
    }

    /* Room Display Section - Modified for Glass Sphere */
    .room-display {
      margin-bottom: 3rem;
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    /* --- The Floating Crystal Sphere (Main Object) --- */
    .sphere-container {
      position: relative;
      width: 400px;
      /* Increased size for visibility */
      height: 400px;
      z-index: 10;
      /* No perspective here to keep it flat/static if desired, or keep for depth */
      perspective: 1000px;
    }

    /* Maximized 3D Glass Effect */
    .crystal-ball {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background: #000;
      /* Inner dark background */

      /* Complex Shadow Layering for Volume & Thickness */
      box-shadow:
        /* 1. Deep Inner Shadow (Volume) */
        inset -20px -20px 60px rgba(0, 0, 0, 0.9),
        /* 2. Warm Rim Light (Bottom Right) */
        inset 10px 10px 40px rgba(255, 214, 170, 0.4),
        /* 3. Cold Rim Light (Top Left) */
        inset 5px 5px 20px rgba(200, 230, 255, 0.3),
        /* 4. Sharp Top Highlight (Glass Surface) */
        inset 0 40px 30px rgba(255, 255, 255, 0.1),
        /* 5. Outer Glow (Warmth) */
        0 0 30px rgba(255, 214, 170, 0.2),
        /* 6. Drop Shadow */
        0 20px 50px rgba(0, 0, 0, 0.6);

      transform-style: preserve-3d;
      /* Static, no tilt transition needed if not moving */

      /* Subtle Caustics Animation on Border */
      animation: glass-shimmer 6s infinite alternate ease-in-out;
    }

    @keyframes glass-shimmer {
      0% {
        box-shadow: inset -20px -20px 60px rgba(0, 0, 0, 0.9), inset 10px 10px 40px rgba(255, 214, 170, 0.3), 0 0 30px rgba(255, 214, 170, 0.1);
      }

      100% {
        box-shadow: inset -20px -20px 60px rgba(0, 0, 0, 0.9), inset 12px 12px 50px rgba(255, 214, 170, 0.5), 0 0 40px rgba(255, 214, 170, 0.3);
      }
    }

    /* Specular Glare - Sharper & Brighter */
    .highlight-glare {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 35%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.4) 40%,
          transparent 70%);
      transform: rotate(-45deg);
      pointer-events: none;
      filter: blur(1px);
      /* Sharper reflection */
      z-index: 20;
      opacity: 0.9;
    }

    /* Secondary Highlight (Rim) */
    .highlight-rim {
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 20%;
      height: 10%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
          rgba(255, 214, 170, 0.8) 0%,
          transparent 70%);
      transform: rotate(-45deg);
      pointer-events: none;
      filter: blur(4px);
      z-index: 20;
      opacity: 0.6;
    }

    /* Inner Content Wrapper */
    #furniture-svg-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(1.1);
      /* Slight zoom to fill sphere */
    }

    #furniture-svg-wrapper svg {
      width: 100%;
      height: 100%;
    }

    /* Hide background rects in SVG */
    #furniture-svg-wrapper svg>rect:not([id]),
    #furniture-svg-wrapper svg g>rect:not([id]) {
      display: none !important;
    }

    /* Description Panel - Glass Style with Warmth */
    .description-panel {
      max-width: 600px;
      margin: 0 auto;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 214, 170, 0.1);
      /* Warm border */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .description-panel h2 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 214, 170, 0.3);
      /* Warm text shadow */
    }

    .description-panel p {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    .description-panel .emoji {
      font-size: 2rem;
      margin-top: 1rem;
      opacity: 0.8;
    }

    /* Features List - Glass Style */
    .features-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .feature-card {
      padding: 1.75rem;
      border-radius: 12px;
      text-align: center;
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 214, 170, 0.2);
      /* Warm hover */
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 214, 170, 0.2);
    }

    .feature-card .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      opacity: 0.85;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .feature-card h3 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .feature-card p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #94a3b8;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 3rem;
      opacity: 0.6;
      color: #fff;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(129, 199, 132, 0.2);
      border-top-color: #81c784;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Environment -->
  <div class="winter-gradient"></div>

  <!-- Rising Warm Lights -->
  <div class="rising-light-container">
    <div class="rising-light"></div>
    <div class="rising-light"></div>
    <div class="rising-light"></div>
  </div>

  <div class="frost-overlay"></div>
  <canvas id="snow-canvas"></canvas>

  <!-- Header -->
  <header class="header">
    <h1>🏛️ 전시회 컨셉 디자인</h1>
    <p>당신의 저축을 예술 작품처럼 전시하세요</p>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Concept Tabs -->
    <div class="concept-tabs">
      <button class="concept-tab" data-concept="gallery">
        🖼️ 미술관 갤러리
      </button>
      <button class="concept-tab active" data-concept="showroom">
        🏠 라이프스타일 쇼룸
      </button>
      <button class="concept-tab" data-concept="diorama">
        💎 디오라마 컬렉션
      </button>
    </div>

    <!-- Room Display Section -->
    <div class="room-display">
      <!-- The Glass Sphere Container -->
      <div class="sphere-container">
        <div class="crystal-ball">
          <!-- Specular Glare -->
          <div class="highlight-glare"></div>
          <div class="highlight-rim"></div> <!-- NEW: Rim Light -->

          <!-- SVG Container (Inner Scene) -->
          <div id="furniture-svg-wrapper">
            <div class="loading">
              <div class="loading-spinner"></div>
              <p>3D 룸 로딩 중...</p>
            </div>
          </div>

          <!-- Inner Frost Reflection -->
          <div
            class="absolute inset-0 bg-gradient-to-tr from-blue-900/30 via-transparent to-white/20 pointer-events-none mix-blend-overlay">
          </div>
        </div>

        <!-- Ground Shadow -->
        <div class="absolute -bottom-12 left-1/2 transform -translate-x-1/2 w-40 h-4 bg-black/50 blur-xl rounded-[50%]">
        </div>
      </div>
    </div>

    <!-- Description Panel -->
    <div class="description-panel">
      <h2>🏠 라이프스타일 쇼룸</h2>
      <p><strong>살고 싶은 공간, 만들어가는 꿈</strong></p>
      <p>유리구슬 속에 담긴 당신의 드림 하우스입니다.</p>
      <p>
        눈 내리는 겨울 풍경과 함께 아늑한 분위기를 즐겨보세요.
      </p>
      <div class="emoji">☕</div>
    </div>

    <!-- Features List -->
    <div class="features-list">
      <div class="feature-card">
        <div class="icon">❄️</div>
        <h3>윈터 에디션</h3>
        <p>눈 내리는 효과와 서리 낀 유리 질감</p>
      </div>

      <div class="feature-card">
        <div class="icon">💡</div>
        <h3>프리미엄 조명</h3>
        <p>세련된 앰비언트 라이트와 반사 효과</p>
      </div>

      <div class="feature-card">
        <div class="icon">🔮</div>
        <h3>크리스탈 스피어</h3>
        <p>3D 유리구슬 효과로 특별한 전시 경험</p>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="./assets/js/lighting-effects.js"></script>
  <script src="./assets/js/theme-toggle.js"></script>
  <script src="./assets/js/color-theme-manager.js"></script>

  <script>
    // ============================================
    // Global Variables
    // ============================================
    let lightingEffects = null;
    let currentConcept = "showroom"; // Default to showroom for this view

    // ============================================
    // Load SVG
    // ============================================
    function loadFurnitureSVG() {
      fetch("../../figure.svg")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`SVG file not found: ${response.status}`);
          }
          return response.text();
        })
        .then((svgContent) => {
          const wrapper = document.getElementById("furniture-svg-wrapper");
          if (!wrapper) return;

          // Insert SVG content
          wrapper.innerHTML = svgContent;

          // Configure SVG
          const svg = wrapper.querySelector("svg");
          if (svg) {
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
            svg.removeAttribute("width");
            svg.removeAttribute("height");
          }

          // Initialize lighting effects
          initLightingEffects();

          // Show all furniture immediately (no scroll animation)
          showAllFurniture();
        })
        .catch((error) => {
          console.error("Error loading SVG:", error);
          const wrapper = document.getElementById("furniture-svg-wrapper");
          if (wrapper) {
            wrapper.innerHTML = `
                            <div class="loading" style="opacity: 1;">
                                <p style="color: #d97979;">⚠️ SVG 파일을 불러올 수 없습니다</p>
                                <p style="font-size: 0.875rem; opacity: 0.7; margin-top: 0.5rem;">
                                    figure.svg 파일이 올바른 위치에 있는지 확인해주세요
                                </p>
                            </div>
                        `;
          }
        });
    }

    // ============================================
    // Show All Furniture (No Animation)
    // ============================================
    function showAllFurniture() {
      const furnitureLayers = document.querySelectorAll(
        '[id^="background"], [id^="sofa"], [id^="tables"], [id^="lamp"], [id^="reze"]'
      );

      furnitureLayers.forEach((layer) => {
        if (typeof gsap !== "undefined") {
          gsap.to(layer, {
            opacity: 1,
            duration: 0.8,
            ease: "power2.out",
          });
        } else {
          layer.style.opacity = "1";
        }
      });
    }

    // ============================================
    // Initialize Lighting Effects
    // ============================================
    function initLightingEffects() {
      const container = document.querySelector(".sphere-container"); // Changed target
      if (!container) return;

      // Create lighting effects for diorama concept
      if (currentConcept === "diorama" || currentConcept === "showroom") {
        // We can reuse the existing lighting logic or simplify it
        // For now, let's just ensure basic visibility
      }
    }

    // ============================================
    // Concept Tabs
    // ============================================
    function initConceptTabs() {
      const tabs = document.querySelectorAll(".concept-tab");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          // Update active state
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          // Get concept
          const concept = tab.dataset.concept;
          // Here we might want to switch content, but for this specific request
          // we are focusing on the visual style.
          // For now, let's just log it.
          console.log("Concept switched to:", concept);
        });
      });
    }

    // ============================================
    // Snow Effect Logic
    // ============================================
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");
    let snowflakes = [];
    let mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Track mouse for physics
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Snowflake {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height; // Start above
        this.size = Math.random() * 3 + 0.5;
        this.speed = Math.random() * 1 + 0.5;
        this.sway = Math.random() * 0.5;
        this.swayOffset = Math.random() * Math.PI * 2;
        this.opacity = Math.random() * 0.5 + 0.1;
      }

      update() {
        // Gravity
        this.y += this.speed;

        // Sway motion
        this.x += Math.sin(this.y * 0.01 + this.swayOffset) * this.sway;

        // Mouse Interaction (Repel)
        if (mouse.x != null) {
          let dx = this.x - mouse.x;
          let dy = this.y - mouse.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          const interactionRadius = 150;

          if (distance < interactionRadius) {
            const forceDirectionX = dx / distance;
            const forceDirectionY = dy / distance;
            const force = (interactionRadius - distance) / interactionRadius;
            const strength = 2; // How strong the wind is

            this.x += forceDirectionX * force * strength;
            this.y += forceDirectionY * force * strength;
          }
        }

        // Reset loop
        if (this.y > canvas.height) {
          this.reset();
          this.y = -10; // Reset to top
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initSnow() {
      snowflakes = [];
      for (let i = 0; i < 150; i++) {
        snowflakes.push(new Snowflake());
      }
    }
    initSnow();

    function animateSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      snowflakes.forEach((f) => {
        f.update();
        f.draw();
      });
      requestAnimationFrame(animateSnow);
    }
    animateSnow();

    // ============================================
    // Initialization
    // ============================================
    document.addEventListener("DOMContentLoaded", () => {
      loadFurnitureSVG();
      initConceptTabs();
    });
  </script>
</body>

</html>
